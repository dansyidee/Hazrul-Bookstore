<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book Details</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial; }
    body { background: #f5f5f5; }

    .wrap {
      max-width: 900px;
      margin: 40px auto;
      background: white;
      border-radius: 10px;
      padding: 24px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    .back {
      display: inline-block;
      margin-bottom: 16px;
      text-decoration: none;
      color: #333;
      font-weight: 600;
    }

    .row {
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: 22px;
      align-items: start;
    }

    img {
      width: 240px;
      height: 360px;
      object-fit: cover;
      border-radius: 8px;
      background: #eee;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin: 10px 0 16px;
      color: #444;
      font-weight: 600;
    }

    .pill {
      background: #f0f0f0;
      padding: 8px 12px;
      border-radius: 999px;
    }

    p {
      color: #555;
      line-height: 1.6;
      font-size: 15px;
      white-space: pre-wrap;
    }

    @media (max-width: 700px) {
      .row { grid-template-columns: 1fr; }
      img { width: 100%; height: auto; aspect-ratio: 2/3; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="home.html">← Back to Home</a>

    <div class="row">
      <img id="details-image" alt="Book cover" src="" />

      <div>
        <h1 id="details-title">Loading...</h1>

        <div class="meta">
          <div class="pill" id="details-price">RM0.00</div>
          <div class="pill" id="details-stock">Stock: 0</div>
          <div class="pill" id="details-genre" style="display:none;"></div>
        </div>

        <p id="details-description">&nbsp;</p>

        <div style="margin-top: 18px;">
          <button id="add-to-cart" style="border: 1px solid black; border-radius: 25px; padding: 8px 16px; color: white; background: black; cursor: pointer;">Add to Cart</button>
        </div>
      </div>
    </div>
  </div>

  <script src="details.js"></script>


  <script>
    (function () {
      const data = (() => {
        try {
          const raw = sessionStorage.getItem('book-details');
          return raw ? JSON.parse(raw) : null;
        } catch (e) {
          return null;
        }
      })();


      if (!data) {
        document.getElementById('details-title').textContent = 'No book selected';
        document.getElementById('details-description').textContent = 'Go back and click "See Details" again.';
        return;
      }

      const imgEl = document.getElementById('details-image');
      imgEl.referrerPolicy = 'no-referrer';
      imgEl.src = data.image || '';
      if (!data.image) imgEl.style.display = 'none';
      document.getElementById('details-title').textContent = data.title || 'Untitled';
      document.getElementById('details-description').textContent = data.description || 'No description available.';

      // Optional genre display
      const genrePill = document.getElementById('details-genre');
      if (genrePill) {
        genrePill.textContent = data.genre ? String(data.genre) : 'Genre: N/A';
      }


      const priceEl = document.getElementById('details-price');
      const price = Number(data.price);
      priceEl.textContent = 'RM' + (Number.isFinite(price) ? price.toFixed(2) : '0.00');

      const stockEl = document.getElementById('details-stock');
      const stock = data.stock;
      stockEl.textContent = 'Stock: ' + (typeof stock === 'number' ? stock : stock ?? '');
    })();
  </script>
</body>
</html>
