<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book Details</title>
  <link rel="stylesheet" href="home.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(255, 255, 255, 0.95), transparent 34%),
        linear-gradient(135deg, #f5f5f5 0%, #ededed 46%, #ffffff 100%);
      color: #111;
    }

    .details-page {
      min-height: 100vh;
      padding: 36px 20px;
    }

    .wrap {
      max-width: 1080px;
      margin: 0 auto;
      background: white;
      border: 1px solid rgba(0, 0, 0, 0.06);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.10);
    }

    .back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 18px;
      text-decoration: none;
      color: #111;
      font-weight: 700;
      background: white;
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 999px;
      padding: 10px 16px;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.08);
    }

    .row {
      display: grid;
      grid-template-columns: minmax(280px, 38%) 1fr;
      min-height: 560px;
    }

    .cover-panel {
      display: grid;
      place-items: center;
      padding: 44px 34px;
      background:
        linear-gradient(140deg, #111 0%, #2d2d2d 55%, #f3f3f3 55%, #ffffff 100%);
    }

    .cover-frame {
      width: min(300px, 100%);
      padding: 12px;
      background: rgba(255, 255, 255, 0.92);
      border-radius: 8px;
      box-shadow: 0 24px 45px rgba(0,0,0,0.28);
    }

    .cover-frame img {
      width: 100%;
      aspect-ratio: 2 / 3;
      object-fit: cover;
      border-radius: 8px;
      background: #eee;
      display: block;
    }

    .info-panel {
      padding: 46px;
      display: grid;
      align-content: center;
    }

    h1 {
      font-size: clamp(30px, 4vw, 48px);
      line-height: 1.08;
      margin-bottom: 12px;
      letter-spacing: 0;
    }

    .author {
      color: #555;
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 18px;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 0 0 26px;
      color: #444;
      font-weight: 600;
    }

    .pill {
      background: #f5f5f5;
      border: 1px solid #e8e8e8;
      padding: 9px 13px;
      border-radius: 999px;
    }

    .description-block {
      border-top: 1px solid #eee;
      padding-top: 24px;
    }

    .description-block h2 {
      font-size: 18px;
      margin-bottom: 10px;
    }

    .button-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 28px;
    }

    .button-row button {
      border: 1px solid black;
      border-radius: 999px;
      padding: 12px 18px;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s ease, color 0.2s ease;
      font-weight: 700;
    }

    #add-to-cart {
      color: white;
      background: black;
    }

    #wishlist-button {
      color: black;
      background: white;
    }

    .button-row button:hover {
      transform: translateY(-1px);
    }

    p {
      color: #555;
      line-height: 1.6;
      font-size: 15px;
      white-space: pre-wrap;
    }

    @media (max-width: 700px) {
      .details-page { padding: 22px 14px; }
      .row { grid-template-columns: 1fr; }
      .cover-panel { padding: 28px 20px; }
      .info-panel { padding: 28px 20px; }
    }
  </style>
</head>
<body>
  <main class="details-page">
    <a class="back" href="home.html">← Back to Home</a>

    <div class="wrap">
      <div class="row">
        <div class="cover-panel">
          <div class="cover-frame">
            <img id="details-image" alt="Book cover" src="" />
          </div>
        </div>

        <div class="info-panel">
          <h1 id="details-title">Loading...</h1>
          <div class="author" id="details-author">Author unavailable</div>

          <div class="meta">
            <div class="pill" id="details-price">RM0.00</div>
            <div class="pill" id="details-stock">Stock: 0</div>
            <div class="pill" id="details-genre">Genre: N/A</div>
          </div>

          <div class="description-block">
            <h2>Description</h2>
            <p id="details-description">&nbsp;</p>
          </div>

          <div class="button-row">
            <button id="add-to-cart">Add to Cart</button>
            <button id="wishlist-button">Add to Wishlist</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="home.js"></script>
  <script src="details.js"></script>


  <script>
    (function () {
      const data = (() => {
        try {
          const raw = sessionStorage.getItem('book-details');
          return raw ? JSON.parse(raw) : null;
        } catch (e) {
          return null;
        }
      })();


      if (!data) {
        document.getElementById('details-title').textContent = 'No book selected';
        document.getElementById('details-description').textContent = 'Go back and click "See Details" again.';
        return;
      }

      const imgEl = document.getElementById('details-image');
      imgEl.referrerPolicy = 'no-referrer';
      imgEl.src = data.image || '';
      document.getElementById('details-title').textContent = data.title || 'Untitled';
      document.getElementById('details-author').textContent = data.author ? 'by ' + data.author : 'Author unavailable';
      document.getElementById('details-description').textContent = data.description || 'No description available.';

      // Optional genre display
      const genrePill = document.getElementById('details-genre');
      if (genrePill) {
        genrePill.textContent = data.genre ? 'Genre: ' + String(data.genre) : 'Genre: N/A';
      }


      const priceEl = document.getElementById('details-price');
      const price = Number(data.price);
      priceEl.textContent = 'RM' + (Number.isFinite(price) ? price.toFixed(2) : '0.00');

      const stockEl = document.getElementById('details-stock');
      const stock = data.stock;
      stockEl.textContent = 'Stock: ' + (typeof stock === 'number' ? stock : stock ?? '');
    })();
  </script>
</body>
</html>
