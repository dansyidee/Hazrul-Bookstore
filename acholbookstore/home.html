<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Store</title>

<link rel="stylesheet" href="home.css">
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
  <div class="nav-top">
    <div class="logo"><a href="#">HazrulBookStore</a></div>

    <div class="search-bar">
      <form id="search-form" onsubmit="return window.handleSearchFromForm ? window.handleSearchFromForm(event) : true">
        <input id="search-term" type="text" placeholder="Search books..." />
        <button type="submit" type="button">Search</button>
      </form>
    </div>


    <div class="nav-right">
      <a href="#">Account</a>
      <details class="nav-cart" id="cart-dropdown">
        <summary id="cart-summary">Cart (<span id="cart-count">0</span>)</summary>
        <div class="cart-panel" id="cart-panel">
          <div class="cart-items" id="cart-items"></div>
          <div class="cart-actions">
            <div class="cart-total" id="cart-total">Total: RM0.00</div>
            <button type="button" class="cart-buy" onclick="window.buyNow && window.buyNow()">Buy Now</button>
            <button type="button" class="cart-clear" onclick="window.clearCart && window.clearCart()">Clear</button>

            <div id="buy-modal-root"></div>
          </div>
        </div>
      </details>
    </div>

  </div>

  <div class="nav-bottom">
    <a href="home.html">Home</a>

    <details class="nav-filter">
      <summary>Filter</summary>

      <div class="nav-filter-panel">
        <div class="filter-group">
          <div class="filter-label">Author</div>
          <input id="filter-author" type="text" placeholder="Type author..." />
        </div>

        <div class="filter-group">
          <div class="filter-label">Genres</div>
          <div class="genre-checks">
            <label><input type="checkbox" class="genre-check" value="Fiction" /> Fiction</label>
            <label><input type="checkbox" class="genre-check" value="Non-fiction" /> Non-fiction</label>
          </div>
        </div>

        <div class="filter-group">
          <div class="filter-label">Price</div>
          <div class="price-row">
            <input id="filter-price-min" type="number" min="0" step="0.01" placeholder="Min" />
            <input id="filter-price-max" type="number" min="0" step="0.01" placeholder="Max" />
          </div>
        </div>

        <div style="display:flex; gap:12px; margin-top:12px;">
          <button type="button" class="filter-enter" onclick="window.applyFilters && window.applyFilters()">Enter</button>
          <button type="button" class="filter-reset" onclick="window.resetFilters && window.resetFilters()">Reset</button>
        </div>

      </div>
    </details>

    <a href="#">New Releases</a>
    <a href="#">Bestsellers</a>
    <a href="about.html">About</a>
  </div>


</div>

<!-- HERO -->
<div class="hero">
  <div class="slides" id="slides">
    <div class="slide" style="background-image:url('https://images5.alphacoders.com/413/413842.jpg')"></div>
    <div class="slide" style="background-image:url('https://wallpapercave.com/wp/wp5334521.jpg')"></div>
    <div class="slide" style="background-image:url('https://images.hdqwalls.com/wallpapers/akatsuki-naruto-4k-2n.jpg')"></div>
  </div>

  <button class="prev" onclick="moveSlide(-1)">❮</button>
  <button class="next" onclick="moveSlide(1)">❯</button>
</div>

<!-- MAIN -->
<div class="container">

  <!-- BOOKS -->

  <div class="books" id="books"></div>

</div>

<!-- Footer -->
<footer class="site-footer">
  <div class="footer-section">
    <div class="footer-title">Customer Service</div>
    <div class="footer-text">acholbooks@gmail.com</div>
  </div>

  <div class="footer-nav-row">
    <div class="footer-title-inline">Customer Service</div>
    <div class="footer-title-inline">About Us</div>
    <div class="footer-title-inline">Social Media</div>
  </div>

  <div class="footer-middle">
    <div class="footer-col">
      <div class="footer-text">acholbooks@gmail.com</div>
    </div>

    <div class="footer-col">
      <div class="footer-text">Sydee</div>
      <div class="footer-text">Fais</div>
      <div class="footer-text">Achol</div>
      <div class="footer-text">Aqil</div>
    </div>

    <div class="footer-col">
      <div class="footer-text">Facebook</div>
      <div class="footer-text">Instagram</div>
      <div class="footer-text">TikTok</div>
    </div>
  </div>


  <div class="footer-bottom">© <span id="year"></span> HazrulBookStore. All rights reserved.</div>
</footer>

<!-- Books DB (Google Books-derived) -->
<script src="books-db.js"></script>
<script src="details.js"></script>
<script src="home.js"></script>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();
</script>


</body>
</html>
